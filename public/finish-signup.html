<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="css/assets/logo1.png">
<title>Finish Signing Up</title>
<link rel="stylesheet" href="finish-signup.css">
</head>

<body>

<div class="container">

<h2>Finish signing up</h2>

<form id="signupForm">

<label for="firstName">First Name <span class="required">*</span></label>
<input type="text" id="firstName" required>

<label for="lastName">Last Name <span class="required">*</span></label>
<input type="text" id="lastName" required>

<label for="dob">Date of Birth <span class="required">*</span></label>
<input type="date" id="dob" required>

<label for="email">Email <span class="required">*</span></label>
<input type="email" id="email" readonly required>

<label for="password">Password <span class="required">*</span></label>
<input type="password" id="password" required>

<!-- PASSWORD RULES -->
<div class="password-rules" id="passwordRules">

<p><b>Password strength:</b> <span id="strengthText">Weak</span></p>

<ul>
<li id="rule2">At least 8 characters</li>
<li id="rule3">Contains a number or symbol</li>
</ul>

</div>

<button type="submit">Agree and Continue</button>

<!-- MARKETING CHECKBOX -->
<div class="terms-container">

<label class="terms-label">

<input type="checkbox" required>

<span>
By selecting <b>Agree and continue</b>, I agree to ShareSphere’s
<a href="#">Terms of Service</a>, Payments Terms of Service, and Nondiscrimination Policy
and acknowledge the Privacy Policy.
</span>

</label>

</div>

</form>

</div>

<script src="finish-signup.js"></script>

</body>
</html>
