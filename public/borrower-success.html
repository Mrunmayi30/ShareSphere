<!DOCTYPE html>
<html>
<head>
    <title>Verification Success</title>
    <link rel="icon" href="css/assets/logo1.png">
    <style>
        body{font-family:Arial;text-align:center;padding-top:100px;background:#f0fff0;}
        h1{color:green;}
        button{padding:10px 20px;font-size:16px;border-radius:8px;border:none;background-color:#193f34;color:white;cursor:pointer;}
        button:hover{background-color:#193f34;}
    </style>
</head>
<body>
    <h1>You're Verified!</h1>
    <p>You can now book items on ShareSphere with secure escrow payments.</p>
    <button onclick="goNext()">Continue</button>
    <script>
        function goNext(){
            // If they were verifying mid-booking, send them straight back to that item
            const pendingItemId = sessionStorage.getItem("rentItemId");
            if(pendingItemId){
                sessionStorage.removeItem("rentItemId");
                window.location.href = "item-details.html?id=" + encodeURIComponent(pendingItemId);
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
