<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Item Uploaded – ShareSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #193f34;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle background circles */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: rgba(255,255,255,0.04);
      top: -200px; right: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: rgba(255,255,255,0.04);
      bottom: -120px; left: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
    }

    /* Checkmark */
    .check-wrapper {
      width: 90px;
      height: 90px;
      margin: 0 auto 2rem;
      position: relative;
    }
    .check-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      box-shadow: 0 0 40px rgba(255,255,255,0.2);
    }
    .check-circle svg path {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.4s 0.45s ease forwards;
    }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes drawCheck { from { stroke-dashoffset: 50; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }

    /* Ring pulse */
    .check-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      opacity: 0;
      animation: ringPulse 1.5s 0.6s ease-out infinite;
    }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* Card */
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      animation: slideUp 0.6s 0.15s ease both;
      backdrop-filter: blur(10px);
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Brand / Logo */
    .brand {
      font-family: "Chiron GoRound TC", 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      display: block;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 1.8rem;
    }

    /* Live chip */
    .item-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1.8rem;
    }
    .item-chip::before {
      content: '';
      width: 6px; height: 6px;
      background: #ffffff;
      border-radius: 50%;
      animation: blink 1.5s ease infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.12);
      margin: 1.5rem 0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.9rem 1.5rem;
      border-radius: 12px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.2px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    /* Primary — white bg, dark text */
    .btn-primary {
      background: #ffffff;
      color: #193f34;
      box-shadow: 0 4px 20px rgba(255,255,255,0.15);
    }
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(255,255,255,0.25); }

    /* Secondary — transparent with white border */
    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1.5px solid rgba(255,255,255,0.35);
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.06); }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="check-wrapper">
      <div class="check-circle">
        <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
          <path d="M10 22L18 30L32 14" stroke="#193f34" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="check-ring"></div>
    </div>

    <div class="card">
      <span class="brand">ShareSphere</span>
      <h1>Item Listed Successfully!</h1>
      <p class="subtitle">Your item is now live on the marketplace. Renters can discover and book it right away.</p>

      <div class="item-chip">Live on marketplace</div>

      <div class="divider"></div>

      <div class="btn-group">
        <a href="/list-item.html" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          Upload Another Item
        </a>
        <a href="/index.html" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Go to Home
        </a>
      </div>

      <p class="footer-note">You'll be notified when someone requests to rent your item.</p>
    </div>
  </div>

</body>
</html>
