<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Item Details – ShareSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #193f34; --forest-deep: #0d271f;
      --white: #ffffff; --off-white: #f5f9f7;
      --muted: rgba(25,63,52,0.5); --border: rgba(25,63,52,0.12);
      --mint-soft: #e8f5f0;
    }
    body { background: var(--off-white); color: var(--forest); font-family: 'Montserrat', sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 100; background: var(--forest); padding: 0 2rem; height: 62px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 16px rgba(25,63,52,0.2); }
    .nav-brand { font-family: "Chiron GoRound TC", 'Montserrat', sans-serif; font-weight: 600; font-size: 1.25rem; color: var(--white); text-decoration: none; letter-spacing: 0.04em; }
    .nav-back { display: flex; align-items: center; gap: 0.4rem; color: rgba(255,255,255,0.7); font-size: 0.88rem; font-weight: 500; text-decoration: none; transition: color 0.2s; }
    .nav-back:hover { color: var(--white); }
    #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 1rem; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--forest); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { display: none; text-align: center; padding: 4rem 2rem; color: var(--muted); }
    #detail-page { display: none; }
    .detail-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .breadcrumb { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; font-weight: 500; }
    .breadcrumb a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--forest); }
    .breadcrumb span { color: var(--forest); font-weight: 600; }
    .breadcrumb-sep { opacity: 0.4; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
    @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; gap: 2rem; } }

    /* ── Gallery ── */
    .gallery { position: sticky; top: 80px; }
    .main-media { width: 100%; aspect-ratio: 4/3; background: var(--white); border-radius: 16px; overflow: hidden; border: 1.5px solid var(--border); position: relative; cursor: zoom-in; box-shadow: 0 4px 24px rgba(25,63,52,0.08); }
    .main-media img, .main-media video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .main-media img.active, .main-media video.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .media-badge { position: absolute; top: 12px; left: 12px; background: var(--forest); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.72rem; color: var(--white); font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.04em; display: flex; align-items: center; gap: 0.4rem; }
    .media-badge .dot { width:6px;height:6px;background:var(--white);border-radius:50%;opacity:0.8; }
    .thumbnails { display: flex; gap: 0.6rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .thumb { width: 70px; height: 70px; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; transition: border-color 0.2s, transform 0.2s; background: var(--white); flex-shrink: 0; box-shadow: 0 2px 8px rgba(25,63,52,0.08); }
    .thumb:hover { transform: translateY(-2px); }
    .thumb.active { border-color: var(--forest); }
    .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .thumb-video-label { width: 70px; height: 70px; border-radius: 10px; background: var(--white); border: 2px solid transparent; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.2rem; cursor: pointer; font-size: 0.65rem; color: var(--muted); font-weight: 600; transition: border-color 0.2s; box-shadow: 0 2px 8px rgba(25,63,52,0.08); }
    .thumb-video-label:hover, .thumb-video-label.active { border-color: var(--forest); color: var(--forest); }

    /* ── Item info ── */
    .item-info { display: flex; flex-direction: column; gap: 0; }
    .category-tag { display: inline-flex; align-items: center; gap: 0.35rem; background: var(--forest); border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.75rem; color: var(--white); font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0.9rem; text-transform: uppercase; width: fit-content; }
    .item-title { font-family: 'Montserrat', sans-serif; font-size: 1.9rem; font-weight: 700; line-height: 1.2; color: var(--forest); margin-bottom: 0.6rem; }
    .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
    .condition-badge { display: inline-flex; align-items: center; gap: 0.3rem; background: rgba(25,63,52,0.08); border: 1.5px solid rgba(25,63,52,0.2); border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.78rem; color: var(--forest); font-weight: 600; }
    .listing-date { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .item-location { font-size: 0.8rem; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem; }

    /* ── Price box ── */
    .price-box { background: var(--forest); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 1.4rem; display: flex; align-items: flex-end; justify-content: space-between; box-shadow: 0 4px 20px rgba(25,63,52,0.2); }
    .price-main { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 700; color: var(--white); }
    .price-per { font-size: 0.9rem; color: rgba(255,255,255,0.6); margin-left: 0.3rem; }
    .price-note { font-size: 0.78rem; color: rgba(255,255,255,0.6); text-align: right; line-height: 1.5; }

    /* ── Deposit strip ── */
    .deposit-strip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--mint-soft); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0.75rem 1.1rem; margin-bottom: 1.4rem;
    }
    .deposit-strip-label { font-size: 0.78rem; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 0.4rem; }
    .deposit-strip-amount { font-size: 1rem; font-weight: 700; color: var(--forest); }

    /* ── Sections ── */
    .section { padding: 1.2rem 0; border-top: 1px solid var(--border); }
    .section-title { font-family: 'Montserrat', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
    .description-text { font-size: 0.93rem; line-height: 1.75; color: var(--forest); font-weight: 400; opacity: 0.85; }
    .rules-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .rules-list li { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.9rem; color: var(--forest); line-height: 1.5; font-weight: 400; }
    .rules-list li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--forest); flex-shrink: 0; margin-top: 0.45em; opacity: 0.5; }

    /* ── Info grid (all extra fields) ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1.2rem;
    }
    .info-cell {
      display: flex; flex-direction: column; gap: 0.2rem;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 0.65rem 0.9rem;
    }
    .info-cell-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .info-cell-value { font-size: 0.88rem; font-weight: 600; color: var(--forest); }
    .info-cell.span-2 { grid-column: span 2; }

    /* ── Owner card ── */
    .owner-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem; box-shadow: 0 2px 12px rgba(25,63,52,0.06); }
    .owner-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--forest); display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--white); flex-shrink: 0; }
    .owner-info { flex: 1; }
    .owner-name { font-weight: 600; font-size: 0.93rem; color: var(--forest); }
    .owner-label { font-size: 0.76rem; color: var(--muted); font-weight: 500; }
    .owner-verified { display: flex; align-items: center; gap: 0.3rem; font-size: 0.74rem; color: var(--forest); font-weight: 600; margin-top: 0.15rem; }

    /* ── CTA ── */
    .cta-group { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
    .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.95rem 1rem; border-radius: 12px; font-family: 'Montserrat', sans-serif; font-size: 0.92rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s, background 0.2s, opacity 0.2s; letter-spacing: 0.2px; }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-call { background: var(--forest); color: var(--white); box-shadow: 0 4px 20px rgba(25,63,52,0.3); }
    .btn-call:hover:not(:disabled) { background: var(--forest-deep); box-shadow: 0 8px 28px rgba(25,63,52,0.4); }
    .btn-email { background: var(--white); color: var(--forest); border: 1.5px solid var(--border); box-shadow: 0 2px 8px rgba(25,63,52,0.06); }
    .btn-email:hover:not(:disabled) { border-color: var(--forest); box-shadow: 0 4px 16px rgba(25,63,52,0.12); }

    /* ── Contact panel ── */
    .contact-panel { display: none; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; box-shadow: 0 2px 12px rgba(25,63,52,0.06); animation: slideDown 0.25s ease; }
    .contact-panel.visible { display: flex; }
    @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .contact-row { display: flex; align-items: center; gap: 0.75rem; }
    .contact-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(25,63,52,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .contact-detail { display: flex; flex-direction: column; }
    .contact-label { font-size: 0.7rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .contact-value { font-size: 0.92rem; font-weight: 600; color: var(--forest); text-decoration: none; }
    .contact-value:hover { text-decoration: underline; }
    .contact-divider { height: 1px; background: var(--border); margin: 0.2rem 0; }

    /* ── Toast ── */
    #toast { display: none; position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--forest); color: var(--white); padding: 1rem 1.75rem; border-radius: 14px; font-size: 0.88rem; font-weight: 600; box-shadow: 0 8px 32px rgba(25,63,52,0.35); z-index: 9999; text-align: center; max-width: 400px; width: calc(100% - 2rem); line-height: 1.5; animation: toastIn 0.3s ease; }
    @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
  </style>
</head>
<body>
  <nav>
    <a href="/index.html" class="nav-brand">ShareSphere</a>
    <a href="javascript:history.back()" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to listings
    </a>
  </nav>

  <div id="loading"><div class="spinner"></div><span style="font-size:0.9rem;font-weight:500;">Loading item...</span></div>
  <div id="error">
    <p style="font-size:1.1rem;margin-bottom:0.5rem;color:var(--forest);">Item not found.</p>
    <a href="/index.html" style="color:var(--forest);font-size:0.9rem;font-weight:600;">← Back to Home</a>
  </div>

  <div id="detail-page">
    <div class="detail-wrapper">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="detail-grid">

        <!-- ── Left: Gallery ── -->
        <div class="gallery">
          <div class="main-media" id="main-media"></div>
          <div class="thumbnails" id="thumbnails"></div>
        </div>

        <!-- ── Right: Info ── -->
        <div class="item-info">
          <div class="category-tag" id="item-category"></div>
          <h1 class="item-title" id="item-title"></h1>
          <div class="meta-row">
            <div class="condition-badge" id="item-condition"></div>
            <span class="listing-date" id="item-date"></span>
            <span class="item-location" id="item-location"></span>
          </div>

          <!-- Price per month -->
          <div class="price-box">
            <div>
              <span class="price-main" id="item-price"></span>
              <span class="price-per">/ month</span>
            </div>
            <div class="price-note">Minimum rental applies<br/>See duration below</div>
          </div>

          <!-- Security deposit -->
          <div class="deposit-strip" id="deposit-strip" style="display:none;">
            <span class="deposit-strip-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Security Deposit
            </span>
            <span class="deposit-strip-amount" id="item-deposit"></span>
          </div>

          <!-- About this item -->
          <div class="section">
            <div class="section-title">About this item</div>
            <p class="description-text" id="item-description"></p>
          </div>

          <!-- Item Specifications -->
          <div class="section" id="specs-section">
            <div class="section-title">Item Specifications</div>
            <div class="info-grid" id="specs-grid"></div>
          </div>

          <!-- Rental Terms -->
          <div class="section" id="rental-section">
            <div class="section-title">Rental Terms</div>
            <div class="info-grid" id="rental-grid"></div>
          </div>

          <!-- Rules & accessories -->
          <div class="section" id="rules-section">
            <div class="section-title">Accessories &amp; Rules</div>
            <ul class="rules-list" id="item-rules"></ul>
          </div>

          <!-- Listed by -->
          <div class="section">
            <div class="section-title">Listed by</div>
            <div class="owner-card">
              <div class="owner-avatar" id="owner-avatar"></div>
              <div class="owner-info">
                <div class="owner-name" id="owner-name"></div>
                <div class="owner-label">Verified Lender</div>
                <div class="owner-verified">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  Identity Verified
                </div>
              </div>
            </div>
          </div>

          <!-- CTA buttons -->
          <div class="section" style="border-top:none; padding-top:0.5rem;">
            <div class="cta-group">
              <button class="btn btn-call" id="callBtn" onclick="handleCall()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 1.06h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.21-1.21a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                </svg>
                Call Owner
              </button>
              <button class="btn btn-email" id="emailBtn" onclick="handleEmail()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>

                Email Owner
              </button>
            </div>

            <div class="contact-panel" id="contactPanel">
              <div class="contact-row" id="phoneRow" style="display:none;">
                <div class="contact-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#193f34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 1.06h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.21-1.21a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                  </svg>
                </div>
                <div class="contact-detail">
                  <span class="contact-label">Phone</span>
                  <a class="contact-value" id="phoneLink" href="#">—</a>
                </div>
              </div>
              <div class="contact-divider" id="contactDivider" style="display:none;"></div>
              <div class="contact-row" id="emailRow" style="display:none;">
                <div class="contact-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#193f34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                  </svg>
                </div>
                <div class="contact-detail">
                  <span class="contact-label">Email</span>
                  <a class="contact-value" id="emailLink" href="#">—</a>

            </div>
          </div>

        </div><!-- end .item-info -->
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const BASE = 'http://localhost:5000';
    let currentItem = null;
    let mediaItems = [];

    function getItemId() { return new URLSearchParams(window.location.search).get('id'); }
    function formatPrice(p) { return '₹' + Number(p).toLocaleString('en-IN'); }
    function formatDate(d) { return new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' }); }
    function getInitials(name) { if (!name) return '?'; return name.charAt(0).toUpperCase(); }

    /* ── Helper: add an info cell ── */
    function addCell(grid, label, value, spanTwo) {
      if (!value || value === '' || value === 'undefined') return;
      const div = document.createElement('div');
      div.className = 'info-cell' + (spanTwo ? ' span-2' : '');
      div.innerHTML = `<span class="info-cell-label">${label}</span><span class="info-cell-value">${value}</span>`;
      grid.appendChild(div);
    }

    /* ── Gallery ── */
    function buildGallery(images, videoPath) {
      const mainMedia = document.getElementById('main-media');
      const thumbsContainer = document.getElementById('thumbnails');
      mediaItems = [];
      let imagePaths = [];
      if (Array.isArray(images)) { imagePaths = images; }
      else if (typeof images === 'string' && images) { try { imagePaths = JSON.parse(images); } catch { imagePaths = [images]; } }
      imagePaths.forEach(src => mediaItems.push({ type: 'image', src: BASE + '/' + src }));
      if (videoPath) mediaItems.push({ type: 'video', src: BASE + '/' + videoPath });
      if (!mediaItems.length) { mainMedia.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:0.9rem;">No images</div>`; return; }
      mediaItems.forEach((m, i) => {
        if (m.type === 'image') {
          const img = document.createElement('img'); img.src = m.src; img.alt = 'Item image';
          img.onerror = () => img.style.display = 'none';
          if (i === 0) img.classList.add('active'); mainMedia.appendChild(img);
        } else {
          const vid = document.createElement('video'); vid.src = m.src; vid.controls = true; vid.style.objectFit = 'contain';
          if (i === 0) vid.classList.add('active'); mainMedia.appendChild(vid);
        }
      });
      const badge = document.createElement('div'); badge.className = 'media-badge';
      badge.innerHTML = `<span class="dot"></span><span id="media-counter">1 / ${mediaItems.length}</span>`;
      mainMedia.appendChild(badge);
      mediaItems.forEach((m, i) => {
        let thumb;
        if (m.type === 'image') {
          thumb = document.createElement('div'); thumb.className = 'thumb' + (i === 0 ? ' active' : '');
          const img = document.createElement('img'); img.src = m.src; img.alt = ''; thumb.appendChild(img);
        } else {
          thumb = document.createElement('div'); thumb.className = 'thumb-video-label' + (i === 0 ? ' active' : '');
          thumb.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Video</span>`;
        }
        thumb.addEventListener('click', () => switchMedia(i)); thumbsContainer.appendChild(thumb);
      });
    }

    function switchMedia(index) {
      const mainMedia = document.getElementById('main-media');
      const thumbsContainer = document.getElementById('thumbnails');
      mainMedia.querySelectorAll('img, video').forEach(el => el.classList.remove('active'));
      thumbsContainer.querySelectorAll('.thumb, .thumb-video-label').forEach(el => el.classList.remove('active'));
      const mediaEls = mainMedia.querySelectorAll('img, video');
      const thumbEls = thumbsContainer.querySelectorAll('.thumb, .thumb-video-label');
      if (mediaEls[index]) mediaEls[index].classList.add('active');
      if (thumbEls[index]) thumbEls[index].classList.add('active');
      const counter = document.getElementById('media-counter');
      if (counter) counter.textContent = `${index + 1} / ${mediaItems.length}`;
    }

    /* ── Load item ── */
    async function loadItem() {
      const id = getItemId();
      if (!id) { showError(); return; }
      try {
        const res = await fetch(`${BASE}/api/items/${id}`);
        if (!res.ok) throw new Error('Not found');
        currentItem = await res.json();
        renderItem(currentItem);
      } catch (err) { console.error(err); showError(); }
    }

    function renderItem(item) {
      document.title = item.title + ' – ShareSphere';

      document.getElementById('breadcrumb').innerHTML =
        `<a href="/index.html">Home</a><span class="breadcrumb-sep">›</span>` +
        `<a href="index.html?category=${encodeURIComponent(item.category)}">${item.category}</a>` +
        `<span class="breadcrumb-sep">›</span><span>${item.title}</span>`;

      document.getElementById('item-category').textContent = item.category;
      document.getElementById('item-title').textContent = item.title;
      document.getElementById('item-condition').textContent = item.condition;
      document.getElementById('item-date').textContent = 'Listed ' + formatDate(item.created_at);

      /* Price — stored as price_per_month now */
      document.getElementById('item-price').textContent = formatPrice(item.price_per_month ?? item.price_per_day ?? 0);

      /* Description */
      document.getElementById('item-description').textContent = item.description || '—';

      /* Location */
      if (item.item_location) {
        const locEl = document.getElementById('item-location');
        locEl.innerHTML =
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">' +
            '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>' +
          '</svg>' + item.item_location;
      }

      /* Deposit strip */
      const depositVal = item.deposit ?? item.security_deposit ?? null;
if (depositVal !== null && depositVal !== '' && Number(depositVal) >= 0) {
  document.getElementById('deposit-strip').style.display = 'flex';
  document.getElementById('item-deposit').textContent = formatPrice(depositVal);
}

      /* ── Specifications grid ── */
      const specsGrid = document.getElementById('specs-grid');
      addCell(specsGrid, 'Brand',          item.brand);
      addCell(specsGrid, 'Model',          item.model_number);
      addCell(specsGrid, 'Serial No.',     item.serial_number);
      addCell(specsGrid, 'Item Age',       item.item_age);
      addCell(specsGrid, 'Condition',      item.condition);
      addCell(specsGrid, 'Maintenance',    item.maintenance);
      addCell(specsGrid, 'Purchase Price', item.purchase_price ? formatPrice(item.purchase_price) : null);
      addCell(specsGrid, 'Warranty',       item.warranty_status);
      addCell(specsGrid, 'Warranty Expiry',item.warranty_expiry);
      addCell(specsGrid, 'Item Age',       item.item_age || item.age || null);
      addCell(specsGrid, 'Insurance',      item.insurance === 'yes' ? '✓ Insured' : item.insurance === 'no' ? 'Not insured' : item.insurance);
      if (specsGrid.children.length === 0) document.getElementById('specs-section').style.display = 'none';

      /* ── Rental terms grid ── */
      const rentalGrid = document.getElementById('rental-grid');
      addCell(rentalGrid, 'Pickup Method',     item.pickup_method);
      addCell(rentalGrid, 'Min. Duration',     item.min_duration);
      addCell(rentalGrid, 'Max. Duration',     item.max_duration);
      if (item.delivery_charges && Number(item.delivery_charges) > 0)
        addCell(rentalGrid, 'Delivery Charges', formatPrice(item.delivery_charges));
      if (item.delivery_radius)
        addCell(rentalGrid, 'Delivery Radius', item.delivery_radius + ' km');
      if (rentalGrid.children.length === 0) document.getElementById('rental-section').style.display = 'none';

      /* ── Rules / accessories ── */
      const rulesEl = document.getElementById('item-rules');
      const rulesSection = document.getElementById('rules-section');
      if (item.rules && item.rules.trim()) {
        item.rules.split('\n').filter(l => l.trim()).forEach(rule => {
          const li = document.createElement('li');
          li.textContent = rule.replace(/^[-•*]\s*/, '');
          rulesEl.appendChild(li);
        });
      } else { rulesSection.style.display = 'none'; }

      /* ── Owner ── */
      const displayName = item.lender_name || item.owner_email;
      document.getElementById('owner-avatar').textContent = getInitials(displayName);
      document.getElementById('owner-name').textContent = displayName;

      buildGallery(item.image_paths, item.video_path);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('detail-page').style.display = 'block';
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    function showToast(msg, duration = 5000) {
      const toast = document.getElementById('toast');
      toast.innerHTML = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, duration);
    }

    function setButtonLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.disabled = loading;
      if (btnId === 'callBtn') {
        btn.innerHTML = loading
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg> Checking...`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.68A2 2 0 012 1.06h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.21-1.21a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg> Call Owner`;
      } else {
        btn.innerHTML = loading
          ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg> Checking...`
          : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Email Owner`;
      }
    }

    async function checkBorrowerAccess() {
      const email = localStorage.getItem('loggedInUser');
      if (!email) {
        sessionStorage.setItem('rentItemId', getItemId());
        window.location.href = 'register.html';
        return false;
      }
      return true;
    }

    function revealContactPanel() {
      document.getElementById('contactPanel').classList.add('visible');
    }

    function populateContactPanel(phone, email) {
      const phoneRow  = document.getElementById('phoneRow');
      const emailRow  = document.getElementById('emailRow');
      const divider   = document.getElementById('contactDivider');
      const phoneLink = document.getElementById('phoneLink');
      const emailLink = document.getElementById('emailLink');
      if (phone) {
        phoneLink.href = 'tel:' + phone.replace(/\s+/g, '');
        phoneLink.textContent = phone;
        phoneRow.style.display = 'flex';
      }
      if (email) {
        const subject = encodeURIComponent('Rental Enquiry: ' + (currentItem.title || 'Item'));
        const body = encodeURIComponent(`Hi,\n\nI'm interested in renting "${currentItem.title}" listed on ShareSphere.\n\nPrice: ₹${currentItem.price_per_month ?? currentItem.price_per_day}/month\n\nPlease let me know the availability.\n\nThanks`);
        emailLink.href = `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;
        emailLink.target = '_blank';
        emailLink.rel = 'noopener noreferrer';
        emailLink.textContent = email;
        emailRow.style.display = 'flex';
      }
      if (phone && email) divider.style.display = 'block';
    }

    function getLenderContacts() {
      return {
        phone: currentItem.lender_phone || null,
        email: currentItem.lender_email || currentItem.owner_email || null,
      };
    }

    async function handleCall() {
      setButtonLoading('callBtn', true);
      const allowed = await checkBorrowerAccess();
      setButtonLoading('callBtn', false);
      if (!allowed) return;
      const { phone } = getLenderContacts();
      if (!phone) { showToast('⚠️ The lender hasn\'t provided a phone number.'); return; }
      populateContactPanel(phone, null);
      revealContactPanel();
      const a = document.createElement('a');
      a.href = 'tel:' + phone.replace(/\s+/g, '');
      a.click();
    }

    async function handleEmail() {
      setButtonLoading('emailBtn', true);
      const allowed = await checkBorrowerAccess();
      setButtonLoading('emailBtn', false);
      if (!allowed) return;
      const { email } = getLenderContacts();
      if (!email) { showToast('⚠️ Lender email is not available.'); return; }
      populateContactPanel(null, email);
      revealContactPanel();
      const subject = encodeURIComponent('Rental Enquiry: ' + (currentItem.title || 'Item'));
      const body = encodeURIComponent(`Hi,\n\nI'm interested in renting "${currentItem.title}" listed on ShareSphere.\n\nPrice: ₹${currentItem.price_per_month ?? currentItem.price_per_day}/month\n\nPlease let me know the availability.\n\nThanks`);
      const a = document.createElement('a');
      a.href = `https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    loadItem();
  </script>
</body>
</html>
