<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become a Lender - ShareSphere</title>
<link rel="stylesheet" href="lender.css">
<link rel="icon" href="css/assets/logo1.png">
</head>
<body>

<div class="form-container">
    <h2>Become a Verified Lender</h2>

    <form id="lenderForm" enctype="multipart/form-data">

        <div class="form-row">
            <label>First Name <span style="color:red">*</span></label>
            <input type="text" id="firstName" readonly>
        </div>

        <div class="form-row">
            <label>Last Name <span style="color:red">*</span></label>
            <input type="text" id="lastName" readonly>
        </div>

        <div class="form-row">
            <label>Date of Birth <span style="color:red">*</span></label>
            <input type="date" id="dob" readonly>
        </div>

        <div class="form-row">
            <label>Email <span style="color:red">*</span></label>
            <input type="email" id="email" readonly>
        </div>

        <div class="form-row">
            <label>Contact Number <span style="color:red">*</span></label>
            <input type="text" id="phone" maxlength="10" required>
        </div>

        <div class="form-row">
            <label>Current Address <span style="color:red">*</span></label>
            <textarea id="address" required></textarea>
        </div>

        <div class="form-row">
            <label>State <span style="color:red">*</span></label>
            <select id="state" required>
                <option value="">Select State</option>
            </select>
        </div>

        <div class="form-row">
            <label>District <span style="color:red">*</span></label>
            <select id="district" required>
                <option value="">Select District</option>
            </select>
        </div>

        <div class="form-row">
            <label>Pincode <span style="color:red">*</span></label>
            <input type="text" id="pincode" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="Enter 6-digit pincode">
        </div>

        <div class="form-row">
            <label>ID Proof Type <span style="color:red">*</span></label>
            <select id="idType" required>
                <option value="">Select ID</option>
                <option>Aadhaar Card</option>
                <option>Driving License</option>
                <option>Voter ID</option>
            </select>
        </div>

        <div class="form-row">
            <label>Upload ID Proof <span style="color:red">*</span></label>
            <input type="file" id="idDocument" required>
        </div>

        <div class="form-row">
            <label>Upload Self Photo <span style="color:red">*</span></label>
            <input type="file" id="selfPhoto" required>
        </div>

        <hr style="margin:1.5rem 0; border:none; border-top:1px solid #ddd;">
        <h3 style="margin-bottom:0.5rem; color:#193f34;">Payout Details</h3>
        <p style="font-size:0.85rem; color:#666; margin-bottom:1rem;">
            This is where your rent earnings will be sent once a booking's pickup is confirmed.
        </p>

        <div class="form-row">
            <label>Account Holder Name <span style="color:red">*</span></label>
            <input type="text" id="accountHolderName" required>
        </div>

        <div class="form-row">
            <label>Bank Account Number <span style="color:red">*</span></label>
            <input type="text" id="bankAccountNumber" required minlength="9" maxlength="18" inputmode="numeric" placeholder="Enter account number (digits only)">
        </div>

        <div class="form-row">
            <label>IFSC Code <span style="color:red">*</span></label>
            <input type="text" id="bankIfsc" required placeholder="e.g. HDFC0001234">
        </div>

        <div class="form-row">
            <label>UPI ID <span style="color:#888;">(optional)</span></label>
            <input type="text" id="upiId" placeholder="e.g. name@okhdfcbank">
        </div>

        <div class="checkbox">
            <input type="checkbox" required>
            <span>I confirm that the information provided is correct.</span>
        </div>

        <button type="submit">Submit Verification</button>
    </form>
</div>

<script>
// Prevent bfcache from restoring stale page
window.addEventListener("pageshow", function(e) {
    if(e.persisted) {
        window.location.reload();
    }
});
document.addEventListener("DOMContentLoaded", function() {
    const email = localStorage.getItem("loggedInUser");
    if(!email) return window.location.href = "login.html";

    // ✅ Check existing lender status BEFORE showing the form
    fetch("/api/lenders/status/" + encodeURIComponent(email))
    .then(res => res.json())
    .then(data => {
        if(data.status === "Verified") {
            return window.location.href = "lender-success.html";
        } else if(data.status === "Rejected") {
    const params = new URLSearchParams(window.location.search);
    if(params.get("reapply") === "true") {
        return loadUserData(email);
    }
    return window.location.href = "lender-failed.html";
}
        // No application yet → fall through and show the form
        loadUserData(email);
    })
    .catch(err => {
        console.error(err);
        loadUserData(email); // on error, just show the form
    });

    function loadUserData(email) {
        document.getElementById("email").value = email;
        fetch("/api/auth/user?email=" + encodeURIComponent(email))
        .then(res => res.json())
        .then(data => {
            document.getElementById("firstName").value = data.first_name || "";
            document.getElementById("lastName").value = data.last_name || "";
            if(data.dob) document.getElementById("dob").value = data.dob.split("T")[0];
        })
        .catch(err => console.error(err));
    }

    const indiaData = {
        "Maharashtra": ["Mumbai","Pune","Nagpur","Nashik","Aurangabad"],
        "Karnataka": ["Bengaluru","Mysuru","Mangaluru","Hubli"],
        "Tamil Nadu": ["Chennai","Coimbatore","Madurai","Salem"],
        "Delhi": ["New Delhi","North Delhi","South Delhi"],
        "West Bengal": ["Kolkata","Howrah","Darjeeling"]
    };
    const stateSelect = document.getElementById("state");
    const districtSelect = document.getElementById("district");
    for(const state in indiaData){
        const option = document.createElement("option");
        option.value = state; option.textContent = state;
        stateSelect.appendChild(option);
    }
    stateSelect.addEventListener("change", function(){
        districtSelect.innerHTML = '<option value="">Select District</option>';
        (indiaData[this.value] || []).forEach(d => {
            const option = document.createElement("option");
            option.value = d; option.textContent = d;
            districtSelect.appendChild(option);
        });
    });

    document.getElementById("phone").addEventListener("input", function(){
        this.value = this.value.replace(/[^0-9]/g,'');
    });

    // FIX: pattern="[0-9]{6}" only validates at submit time — it doesn't
    // stop letters/symbols from being typed. Strip anything non-numeric as
    // the user types, same approach as the phone field above.
    document.getElementById("pincode").addEventListener("input", function(){
        this.value = this.value.replace(/[^0-9]/g,'');
    });
    // FIX: same treatment as pincode/phone — pattern/maxlength alone don't
    // stop non-numeric characters (or spaces) from being typed. Strip
    // anything that isn't a digit as the user types.
    document.getElementById("bankAccountNumber").addEventListener("input", function(){
        this.value = this.value.replace(/[^0-9]/g,'');
    });
});
document.getElementById("lenderForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const email = document.getElementById("email").value;
    if(!email){
        alert("No email found! Cannot submit form.");
        return;
    }

    const accHolder = document.getElementById("accountHolderName").value.trim();
    const accNum    = document.getElementById("bankAccountNumber").value.trim();
    const ifsc      = document.getElementById("bankIfsc").value.trim();

    if (!accHolder || !accNum || !ifsc) {
        alert("Please provide your account holder name, bank account number, and IFSC code.");
        return;
    }

    // FIX: minlength/maxlength on the input aren't enforced automatically
    // since the form's default submit validation is bypassed above
    // (e.preventDefault() + manual checks). Real Indian bank account
    // numbers run roughly 9–18 digits depending on the bank, so check that
    // range explicitly rather than requiring one fixed length.
    if (accNum.length < 9 || accNum.length > 18) {
        alert("Bank account number should be between 9 and 18 digits.");
        return;
    }

    const formData = new FormData();
    ["firstName","lastName","dob","email","phone","address","state","district","pincode","idType",
     "accountHolderName","bankAccountNumber","bankIfsc","upiId"].forEach(id => {
        formData.append(id, document.getElementById(id).value);
    });
    formData.append("idDocument", document.getElementById("idDocument").files[0]);
    formData.append("selfPhoto", document.getElementById("selfPhoto").files[0]);

    try {
        const res = await fetch("/api/lenders/apply", { method:"POST", body: formData });
        const data = await res.json();
        if(data.success){
            // ✅ Save email in sessionStorage for polling
            sessionStorage.setItem("userEmail", email);

            // ✅ Redirect to waiting page
            // Replace sessionStorage redirect with this:
            window.location.href = `waiting-verification.html?email=${encodeURIComponent(email)}`;
        } else {
            alert(data.message);
        }
    } catch(err){
        console.error(err);
        alert("Something went wrong while submitting the form.");
    }
});
</script>
</body>
</html>
