<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="css/assets/logo1.png">
    <title>ShareSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #faf8f3;
            margin: 0;
        }

        /* ── Topbar ── */
        .topbar {
            background: #193f34;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar .logo {
            display: flex; align-items: center; gap: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 30px; font-weight: 700; color: #fff;
            text-decoration: none;
        }
        .topbar .logo img { height: 36px; }
        .back-btn {
            display: flex; align-items: center; gap: 6px;
            color: #fff; font-size: 13px; font-weight: 500;
            text-decoration: none; opacity: 0.85;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 1; }

        /* ── Page content ── */
        .page-wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* Breadcrumb */
        .breadcrumb {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: #6b7280;
            margin-bottom: 20px;
        }
        .breadcrumb a { color: #6b7280; text-decoration: none; }
        .breadcrumb a:hover { color: #193f34; }
        .breadcrumb .sep { font-size: 9px; }
        .breadcrumb .current { color: #193f34; font-weight: 600; }

        /* Page heading */
        .page-header {
            display: flex; align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap; gap: 10px;
        }
        .page-title {
            font-size: 26px; font-weight: 700; color: #193f34;
        }
        .item-count {
            font-size: 13px; color: #6b7280; font-weight: 500;
            padding-bottom: 4px;
        }

        /* Sort bar */
        .sort-bar {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 20px; flex-wrap: wrap;
        }
        .sort-label { font-size: 12px; font-weight: 600; color: #6b7280; }
        .sort-btn {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1.5px solid #e2e8e4;
            background: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px; font-weight: 600; color: #6b7280;
            cursor: pointer; transition: all 0.2s;
        }
        .sort-btn:hover { border-color: #193f34; color: #193f34; }
        .sort-btn.active { background: #193f34; border-color: #193f34; color: #fff; }

        /* ── Main layout: sidebar + content ── */
        .main-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* ── Location Filter Sidebar ── */
        .filter-sidebar {
            width: 248px;
            flex-shrink: 0;
            background: #fff;
            border: 1px solid #e2e8e4;
            border-radius: 14px;
            overflow: hidden;
            position: sticky;
            top: 78px;
            max-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .filter-header {
            padding: 16px 18px 14px;
            border-bottom: 1px solid #e8f5f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .filter-title {
            font-size: 13px;
            font-weight: 700;
            color: #193f34;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .filter-title i { font-size: 14px; color: #2a6652; }

        .clear-filter-btn {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            display: none;
        }
        .clear-filter-btn:hover { color: #193f34; background: #e8f5f0; }
        .clear-filter-btn.visible { display: block; }

        /* Search box inside sidebar */
        .location-search-wrap {
            padding: 12px 14px;
            border-bottom: 1px solid #f0f4f2;
            flex-shrink: 0;
        }
        .location-search-wrap input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border: 1.5px solid #e2e8e4;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #1a1a1a;
            background: #faf8f3;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .location-search-wrap input:focus { border-color: #193f34; }
        .search-icon-wrap {
            position: relative;
        }
        .search-icon-wrap i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #9ca3af;
            pointer-events: none;
        }

        /* Scrollable states/cities list */
        .states-list {
            overflow-y: auto;
            flex: 1;
            padding: 8px 0 12px;
        }
        .states-list::-webkit-scrollbar { width: 4px; }
        .states-list::-webkit-scrollbar-track { background: transparent; }
        .states-list::-webkit-scrollbar-thumb { background: #c8ebe0; border-radius: 2px; }

        /* State accordion item */
        .state-item {}

        .state-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 18px;
            background: none;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, color 0.15s;
            gap: 6px;
        }
        .state-toggle:hover { background: #f0faf6; color: #193f34; }
        .state-toggle.has-selection { color: #193f34; }
        .state-toggle .state-name { flex: 1; }
        .state-toggle .state-count {
            font-size: 10px;
            font-weight: 600;
            background: #e8f5f0;
            color: #193f34;
            border-radius: 10px;
            padding: 1px 7px;
            min-width: 18px;
            text-align: center;
        }
        .state-toggle .chevron {
            font-size: 10px;
            color: #9ca3af;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .state-toggle.open .chevron { transform: rotate(180deg); }

        /* Cities list under a state */
        .cities-list {
            display: none;
            padding: 2px 0 6px 0;
            background: #fafcfb;
            border-top: 1px solid #f0f4f2;
            border-bottom: 1px solid #f0f4f2;
        }
        .cities-list.open { display: block; }

        .city-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px 7px 30px;
            cursor: pointer;
            transition: background 0.12s;
            font-size: 12px;
            color: #4b5563;
            font-weight: 400;
        }
        .city-option:hover { background: #e8f5f0; color: #193f34; }
        .city-option.selected {
            background: #c8ebe0;
            color: #193f34;
            font-weight: 600;
        }
        .city-option input[type="checkbox"] {
            accent-color: #193f34;
            width: 13px;
            height: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Active filter chips */
        .active-filters {
            display: none;
            padding: 10px 14px 6px;
            border-top: 1px solid #f0f4f2;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }
        .active-filters.visible { display: flex; }
        .filter-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #193f34;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
        }
        .filter-chip button {
            background: none;
            border: none;
            color: #a8d8c8;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            line-height: 1;
            margin-left: 1px;
            transition: color 0.15s;
        }
        .filter-chip button:hover { color: #fff; }

        /* No results in filter */
        .filter-no-results {
            padding: 20px 18px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            display: none;
        }

        /* ── Content area ── */
        .content-area { flex: 1; min-width: 0; }

        /* ── Grid ── */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        /* ── Card ── */
        .item-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8e4;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.1);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 4/3;
            background: #f0f4f2;
            overflow: hidden;
            position: relative;
        }
        .card-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .item-card:hover .card-image img { transform: scale(1.05); }
        .no-image {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: #b0bdb8; font-size: 13px;
        }

        .card-body { padding: 12px 14px 14px; }

        .card-title {
            font-size: 14px; font-weight: 600; color: #1a1a1a;
            margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ── Amazon-style rating row on each card ── */
        .card-rating {
            display: none;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }
        .card-rating .stars {
            color: #f0a500;
            font-size: 11px;
            letter-spacing: 0.03em;
        }
        .card-rating .count {
            font-size: 10px;
            color: #6b7280;
            font-weight: 500;
        }

        .card-location {
            font-size: 11px; color: #9ca3af;
            margin-bottom: 10px;
            display: flex; align-items: center; gap: 4px;
        }

        .card-bottom {
            display: flex; align-items: center; justify-content: space-between;
        }

        .card-price {
            font-size: 16px; font-weight: 700; color: #193f34;
        }
        .card-price span {
            font-size: 11px; font-weight: 400; color: #6b7280;
        }

        .card-badge {
            font-size: 10px; font-weight: 600;
            padding: 3px 9px; border-radius: 999px;
            background: #e8f5f0; color: #193f34;
        }

        .item-card.unavailable { opacity: 0.55; }
        .item-card.unavailable .card-image img { filter: grayscale(60%); }
        .item-card.unavailable .card-badge { background: #fde8e8; color: #c0392b; }
        
        /* ── States ── */
        .loading-wrap {
            grid-column: 1/-1;
            display: flex; justify-content: center; padding: 80px 0;
        }
        .spinner {
            width: 38px; height: 38px;
            border: 3px solid #e2e8e4;
            border-top-color: #193f34;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            grid-column: 1/-1;
            text-align: center; padding: 80px 20px;
        }
        .empty-state .empty-icon {
            font-size: 52px; color: #c8ebe0; margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 18px; font-weight: 700;
            color: #193f34; margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 13px; color: #6b7280;
        }

        /* Mobile filter toggle */
        .mobile-filter-toggle {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: #fff;
            border: 1.5px solid #e2e8e4;
            border-radius: 999px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #193f34;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .mobile-filter-toggle:hover { background: #e8f5f0; }
        .mobile-filter-toggle .filter-badge {
            background: #193f34;
            color: #fff;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 10px;
            display: none;
        }
        .mobile-filter-toggle .filter-badge.visible { display: inline-block; }

        /* Mobile overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
        }
        .sidebar-overlay.open { display: block; }

        @media (max-width: 820px) {
            .filter-sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                width: 272px;
                height: 100vh;
                max-height: 100vh;
                z-index: 300;
                border-radius: 0 16px 16px 0;
                transition: left 0.3s ease;
            }
            .filter-sidebar.open { left: 0; }
            .mobile-filter-toggle { display: flex; }
            .main-layout { display: block; }
        }

        @media (max-width: 600px) {
            .page-wrap { padding: 20px 14px 60px; }
            .page-title { font-size: 20px; }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <!-- Topbar -->
    <div class="topbar">
        <a href="index.html" class="logo">
            <img src="css/assets/logo3.png" alt="ShareSphere Logo">
            ShareSphere
        </a>
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="page-wrap">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <span class="sep"><i class="fa-solid fa-chevron-right"></i></span>
            <span class="current" id="breadcrumbCat">Category</span>
        </div>

        <!-- Heading + count -->
        <div class="page-header">
            <h1 class="page-title" id="pageTitle">Loading...</h1>
            <span class="item-count" id="itemCount"></span>
        </div>

        <!-- Sort + mobile filter toggle -->
        <div class="sort-bar">
            <button class="mobile-filter-toggle" id="mobileFilterBtn" onclick="openSidebar()">
                <i class="fa-solid fa-sliders"></i>
                Location Filter
                <span class="filter-badge" id="mobileFilterBadge">0</span>
            </button>
            <span class="sort-label">Sort by:</span>
            <button class="sort-btn active" data-sort="newest">Newest First</button>
            <button class="sort-btn" data-sort="price-low">Price: Low → High</button>
            <button class="sort-btn" data-sort="price-high">Price: High → Low</button>
        </div>

        <div class="main-layout">

            <!-- ── LOCATION FILTER SIDEBAR ── -->
            <aside class="filter-sidebar" id="filterSidebar">

                <div class="filter-header">
                    <div class="filter-title">
                        <i class="fa-solid fa-location-dot"></i>
                        Location
                    </div>
                    <button class="clear-filter-btn" id="clearFilterBtn" onclick="clearAllFilters()">Clear all</button>
                </div>

                <div class="location-search-wrap">
                    <div class="search-icon-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="locationSearch" placeholder="Search state or city…" oninput="filterLocationList(this.value)">
                    </div>
                </div>

                <!-- Active filter chips -->
                <div class="active-filters" id="activeFilters"></div>

                <!-- States accordion list -->
                <div class="states-list" id="statesList"></div>

                <div class="filter-no-results" id="filterNoResults">
                    <i class="fa-solid fa-circle-exclamation" style="font-size:20px;color:#c8ebe0;display:block;margin-bottom:8px;"></i>
                    No matches found
                </div>

            </aside>

            <!-- ── ITEMS CONTENT ── -->
            <div class="content-area">
                <div class="items-grid" id="itemsGrid">
                    <div class="loading-wrap"><div class="spinner"></div></div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const BASE   = 'http://localhost:5000';
        let allItems = [];
        let sortMode = 'newest';
        let fuse = null; // Fuse.js fuzzy-search index, built once items are loaded

        /* ── Selected filters: Set of city strings (lowercase) ── */
        let selectedCities = new Set();
        let selectedStates = new Set(); /* tracks which states have ≥1 city selected */

        /* ── URL param ── */
        const urlParams = new URLSearchParams(window.location.search);
        const category  = urlParams.get('cat') || '';

        document.getElementById('pageTitle').textContent     = category || 'All Items';
        document.getElementById('breadcrumbCat').textContent = category || 'All Items';
        document.title = `${category} – ShareSphere`;

        /* ════════════════════════════════════════════════════════════════
           INDIA STATES + CITIES DATA
           Cities are sorted A-Z per state. Items fetched from the API
           that have a matching item_location will show counts next to
           each state.
        ════════════════════════════════════════════════════════════════ */

            "Karnataka":         ["Bengaluru","Mysuru","Hubballi","Mangaluru","Belagavi","Kalaburagi","Davanagere","Shivamogga","Tumkur","Udupi"],
            "Kerala":            ["Thiruvananthapuram","Kochi","Kozhikode","Thrissur","Kollam","Kannur","Alappuzha","Palakkad","Malappuram"],

            "Punjab":            ["Ludhiana","Amritsar","Jalandhar","Patiala","Bathinda","Mohali","Hoshiarpur"],
            "Rajasthan":         ["Jaipur","Jodhpur","Udaipur","Kota","Bikaner","Ajmer","Bharatpur","Alwar","Sikar"],
            "Sikkim":            ["Gangtok","Namchi","Geyzing","Mangan"],
            "Tamil Nadu":        ["Chennai","Coimbatore","Madurai","Tiruchirappalli","Salem","Tirunelveli","Tiruppur","Vellore","Erode","Thoothukkudi"],
            "Telangana":         ["Hyderabad","Warangal","Nizamabad","Karimnagar","Khammam","Ramagundam","Nalgonda"],
            "Tripura":           ["Agartala","Udaipur","Dharmanagar","Kailasahar"],
            "Uttar Pradesh":     ["Lucknow","Kanpur","Ghaziabad","Agra","Meerut","Varanasi","Allahabad","Bareilly","Aligarh","Moradabad","Noida","Saharanpur"],
            "Uttarakhand":       ["Dehradun","Haridwar","Roorkee","Haldwani","Rishikesh","Rudrapur","Kashipur"],
            "West Bengal":       ["Kolkata","Howrah","Durgapur","Asansol","Siliguri","Bardhaman","Malda","Kharagpur"],
            "Delhi":             ["New Delhi","Dwarka","Rohini","Pitampura","Lajpat Nagar","Saket","Janakpuri","Noida Extension","Connaught Place"],
            "Chandigarh":        ["Chandigarh","Mohali","Panchkula"],
            "Puducherry":        ["Puducherry","Karaikal","Mahe","Yanam"],
            "Ladakh":            ["Leh","Kargil"],
            "Jammu & Kashmir":   ["Srinagar","Jammu","Anantnag","Baramulla","Sopore","Udhampur"]
        };

        /* ════════════════════════════════════════════════════════════════
           FETCH ITEMS
        ════════════════════════════════════════════════════════════════ */
        async function loadItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

            try {
                const url = category
                    ? `${BASE}/api/items?category=${encodeURIComponent(category)}`
                    : `${BASE}/api/items`;
                const res  = await fetch(url);
                const data = await res.json();
                allItems   = data.items || [];
                // Apply search query from URL if present
const searchQuery = urlParams.get('search') || '';
if (searchQuery) {
    document.getElementById('pageTitle').textContent = `Search: "${searchQuery}"`;
    document.getElementById('breadcrumbCat').textContent = `Search: "${searchQuery}"`;
    document.title = `${searchQuery} – ShareSphere`;
}
                buildSearchIndex();
                buildSidebar();
                applyFilters();
            } catch (err) {
                document.getElementById('itemsGrid').innerHTML =
                    '<p style="grid-column:1/-1;text-align:center;color:#6b7280;padding:60px 0;">Failed to load. Please refresh.</p>';
            }
        }

        /* ════════════════════════════════════════════════════════════════
           FUZZY SEARCH INDEX (Fuse.js)
           Builds a typo-tolerant, multi-field search index over items so
           the search bar behaves like a real e-commerce search: it matches
           partial words, word order doesn't matter, and small spelling
           mistakes still return relevant results, ranked by relevance.
        ════════════════════════════════════════════════════════════════ */
        function buildSearchIndex() {
            if (typeof Fuse === 'undefined') { fuse = null; return; }
            fuse = new Fuse(allItems, {
                keys: [
                    { name: 'title',         weight: 0.5 },
                    { name: 'category',      weight: 0.25 },
                    { name: 'description',   weight: 0.15 },
                    { name: 'item_location', weight: 0.10 }
                ],
                threshold: 0.4,        // 0 = exact match only, 1 = match almost anything
                distance: 100,         // how far a match can be from the expected position
                ignoreLocation: true,  // match anywhere in the field, not just near the start
                minMatchCharLength: 2,
                useExtended: false
            });
        }

        /* Fuzzy-search allItems for a free-text query, returns matches
           ranked best-first. Falls back to a simple "contains any word"
           search if Fuse.js failed to load for some reason. */
        function fuzzySearchItems(query) {
            const q = query.trim();
            if (!q) return allItems;

            if (fuse) {
                return fuse.search(q).map(result => result.item);
            }

            // Fallback: match if ANY word in the query appears in any field
            const words = q.toLowerCase().split(/\s+/).filter(Boolean);
            return allItems.filter(item => {
                const haystack = [
                    item.title, item.category, item.description, item.item_location
                ].filter(Boolean).join(' ').toLowerCase();
                return words.some(w => haystack.includes(w));
            });
        }

        /* ════════════════════════════════════════════════════════════════
           BUILD SIDEBAR — counts cities that actually have items
        ════════════════════════════════════════════════════════════════ */
       function buildSidebar() {
    const cityCountMap  = {};
    const stateCountMap = {};

    allItems.forEach(item => {
        // Try both common field names
        const loc = (item.item_location || item.location || item.city || '').trim().toLowerCase();
        if (!loc) return;

        for (const [state, cities] of Object.entries(INDIA_LOCATIONS)) {
            let stateMatched = false;
            for (const city of cities) {
                if (loc.includes(city.toLowerCase())) {
                    const key = city.toLowerCase();
                    cityCountMap[key] = (cityCountMap[key] || 0) + 1;
                    stateMatched = true;
                }
            }
            if (stateMatched || loc.includes(state.toLowerCase())) {
                stateCountMap[state] = (stateCountMap[state] || 0) + 1;
            }
        }
    });

    renderStatesList(INDIA_LOCATIONS, cityCountMap, stateCountMap, '');
}

        function renderStatesList(locationsObj, cityCountMap, stateCountMap, searchTerm) {
            const container  = document.getElementById('statesList');
            const noResults  = document.getElementById('filterNoResults');
            container.innerHTML = '';
            let visibleCount = 0;
            const term = searchTerm.toLowerCase().trim();

            /* Sort: states with items first, then alphabetically */
            const sortedStates = Object.keys(locationsObj).sort((a, b) => {
                const aCount = stateCountMap[a] || 0;
                const bCount = stateCountMap[b] || 0;
                if (bCount !== aCount) return bCount - aCount;
                return a.localeCompare(b);
            });

            for (const state of sortedStates) {
                const cities     = locationsObj[state];
                const stateCount = stateCountMap[state] || 0;

                /* Filter by search term */
                const stateMatch = !term || state.toLowerCase().includes(term);
                const matchedCities = cities.filter(c =>
                    !term || c.toLowerCase().includes(term) || stateMatch
                );
                if (matchedCities.length === 0) continue;

                visibleCount++;
                const stateHasSel = matchedCities.some(c => selectedCities.has(c.toLowerCase()));

                const stateDiv = document.createElement('div');
                stateDiv.className = 'state-item';
                stateDiv.dataset.state = state;

                const isOpen = (term !== '') || stateHasSel;

                stateDiv.innerHTML = `
                    <button class="state-toggle ${stateHasSel ? 'has-selection' : ''} ${isOpen ? 'open' : ''}"
                            onclick="toggleState(this)"
                            data-state="${esc(state)}">
                        <span class="state-name">${esc(state)}</span>
                        ${stateCount > 0 ? `<span class="state-count">${stateCount}</span>` : ''}
                        <i class="fa-solid fa-chevron-down chevron"></i>
                    </button>
                    <div class="cities-list ${isOpen ? 'open' : ''}" id="cities-${slugify(state)}">
                        ${matchedCities.map(city => {
                            const cityKey   = city.toLowerCase();
                            const cityCount = cityCountMap[cityKey] || 0;
                            const isChecked = selectedCities.has(cityKey);
                            return `<label class="city-option ${isChecked ? 'selected' : ''}"
                                        data-city="${esc(cityKey)}"
                                        data-state="${esc(state)}">
                                <input type="checkbox" ${isChecked ? 'checked' : ''}
                                    onchange="toggleCity(this, '${esc(cityKey)}', '${esc(state)}')">
                                ${esc(city)}
                                ${cityCount > 0 ? `<span style="margin-left:auto;font-size:10px;font-weight:600;color:#2a6652;">${cityCount}</span>` : ''}
                            </label>`;
                        }).join('')}
                    </div>`;
                container.appendChild(stateDiv);
            }

            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function slugify(s) { return s.replace(/[^a-zA-Z0-9]/g, '-'); }

        /* ════════════════════════════════════════════════════════════════
           SIDEBAR INTERACTIONS
        ════════════════════════════════════════════════════════════════ */
        function toggleState(btn) {
            const state = btn.dataset.state;
            const citiesDiv = document.getElementById(`cities-${slugify(state)}`);
            const isOpen = citiesDiv.classList.contains('open');
            citiesDiv.classList.toggle('open', !isOpen);
            btn.classList.toggle('open', !isOpen);
        }

        function toggleCity(checkbox, cityKey, state) {
            if (checkbox.checked) {
                selectedCities.add(cityKey);
            } else {
                selectedCities.delete(cityKey);
            }
            /* Update label styling */
            const label = checkbox.closest('.city-option');
            label.classList.toggle('selected', checkbox.checked);

            /* Update state toggle style */
            const stateBtn = document.querySelector(`.state-toggle[data-state="${esc(state)}"]`);
            if (stateBtn) {
                const anySelected = [...selectedCities].some(c => {
                    const cities = INDIA_LOCATIONS[state] || [];
                    return cities.some(ci => ci.toLowerCase() === c);
                });
                stateBtn.classList.toggle('has-selection', anySelected);
            }

            updateFilterUI();
            applyFilters();
        }

        function clearAllFilters() {
            selectedCities.clear();
            document.querySelectorAll('.city-option').forEach(el => {
                el.classList.remove('selected');
                el.querySelector('input').checked = false;
            });
            document.querySelectorAll('.state-toggle').forEach(btn => btn.classList.remove('has-selection'));
            updateFilterUI();
            applyFilters();
        }

        function removeFilterChip(cityKey) {
            selectedCities.delete(cityKey);
            const cb = document.querySelector(`.city-option[data-city="${cityKey}"] input`);
            if (cb) {
                cb.checked = false;
                cb.closest('.city-option').classList.remove('selected');
            }
            /* Re-evaluate state toggle */
            document.querySelectorAll('.state-toggle').forEach(btn => {
                const state = btn.dataset.state;
                if (!state) return;
                const anySelected = [...selectedCities].some(c => {
                    const cities = INDIA_LOCATIONS[state] || [];
                    return cities.some(ci => ci.toLowerCase() === c);
                });
                btn.classList.toggle('has-selection', anySelected);
            });
            updateFilterUI();
            applyFilters();
        }

        function updateFilterUI() {
            const count = selectedCities.size;
            const clearBtn = document.getElementById('clearFilterBtn');
            const chipsWrap = document.getElementById('activeFilters');
            const mobileBadge = document.getElementById('mobileFilterBadge');

            clearBtn.classList.toggle('visible', count > 0);
            chipsWrap.classList.toggle('visible', count > 0);

            if (mobileBadge) {
                mobileBadge.textContent = count;
                mobileBadge.classList.toggle('visible', count > 0);
            }

            /* Render chips */
            chipsWrap.innerHTML = '';
            selectedCities.forEach(cityKey => {
                const displayName = cityKey.replace(/\b\w/g, l => l.toUpperCase());
                const chip = document.createElement('div');
                chip.className = 'filter-chip';
                chip.innerHTML = `${esc(displayName)}<button onclick="removeFilterChip('${esc(cityKey)}')" title="Remove">×</button>`;
                chipsWrap.appendChild(chip);
            });
        }

        function filterLocationList(value) {
            /* Rebuild list with search filter */
            const cityCountMap  = {};
            const stateCountMap = {};
            allItems.forEach(item => {
                const loc = (item.item_location || item.location || item.city || '').trim().toLowerCase();
                if (!loc) return;
                for (const [state, cities] of Object.entries(INDIA_LOCATIONS)) {
                    for (const city of cities) {
                        if (loc.includes(city.toLowerCase())) {
                            cityCountMap[city.toLowerCase()] = (cityCountMap[city.toLowerCase()] || 0) + 1;
                            stateCountMap[state] = (stateCountMap[state] || 0) + 1;
                        }
                    }
                }
            });
            renderStatesList(INDIA_LOCATIONS, cityCountMap, stateCountMap, value);
        }

        /* ════════════════════════════════════════════════════════════════
           APPLY FILTERS + SORT
        ════════════════════════════════════════════════════════════════ */
     function applyFilters() {
    const searchQuery = (urlParams.get('search') || '').trim();
    let filtered = allItems;

    // Fuzzy, typo-tolerant search across title/category/description/location.
    // Results come back already ranked best-match-first by Fuse.js.
    if (searchQuery) {
        filtered = fuzzySearchItems(searchQuery);
    }

    // Filter by selected cities
    if (selectedCities.size > 0) {
        filtered = filtered.filter(item => {
            const loc = (item.item_location || '').toLowerCase();
            return [...selectedCities].some(city => loc.includes(city.toLowerCase()));
        });
    }

    const total   = allItems.length;
    const showing = filtered.length;
    document.getElementById('itemCount').textContent =
        total === 0             ? 'No items yet' :
        selectedCities.size === 0 && !searchQuery ? (total === 1 ? '1 item available' : `${total} items available`) :
        `${showing} of ${total} items`;

    renderItems(sorted(filtered, !!searchQuery));
}
        function sorted(items, preserveRelevanceOrder) {
            const arr = [...items];
            if (sortMode === 'price-low')  return arr.sort((a,b) => (a.price_per_month ?? a.price_per_day ?? 0) - (b.price_per_month ?? b.price_per_day ?? 0));
            if (sortMode === 'price-high') return arr.sort((a,b) => (b.price_per_month ?? b.price_per_day ?? 0) - (a.price_per_month ?? a.price_per_day ?? 0));
            // "newest" (default): if we just ran a search, keep Fuse's
            // relevance ranking instead of re-sorting; otherwise leave
            // items in their original (newest-first, from the API) order.
            return arr;
        }

        /* ════════════════════════════════════════════════════════════════
           RENDER CARDS
        ════════════════════════════════════════════════════════════════ */
        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            if (!items.length) {
                const reason = selectedCities.size > 0 ? 'selected location' : (category || 'this category');
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-box-open"></i></div>
                        <h3>No items in ${esc(reason)} yet</h3>
                        <p>${selectedCities.size > 0 ? 'Try selecting a different location or clearing the filter.' : 'Check back soon, or be the first to list one!'}</p>
                    </div>`;
                return;
            }

            items.forEach(item => grid.appendChild(buildCard(item)));

            // Fetch ratings for every distinct lender shown in this exact
            // set of cards, in a single batched request, then fill in the
            // per-card stars once they arrive. Cards without a rating yet
            // (or with zero reviews) simply keep the rating row hidden.
            loadCardRatings(items);
        }

        /* ════════════════════════════════════════════════════════════════
           AMAZON-STYLE CARD RATINGS
           Uses GET /api/reviews/users/batch?emails=... so a whole grid of
           cards loads its ratings in one request instead of one per card.
        ════════════════════════════════════════════════════════════════ */
        async function loadCardRatings(items) {
            const emails = [...new Set(
                items
                    .map(i => i.owner_email || i.lender_email || i.owner || i.email)
                    .filter(Boolean)
            )];
            if (!emails.length) {
                console.warn(
                    'loadCardRatings: no owner email found on any item — check what field ' +
                    'name GET /api/items actually returns for the lender (e.g. open the ' +
                    'Network tab, inspect the response, and look for something like ' +
                    'owner_email / lender_email). Sample item:', items[0]
                );
                return;
            }

            try {
                const res = await fetch(`${BASE}/api/reviews/users/batch?emails=${encodeURIComponent(emails.join(','))}`);
                const data = await res.json();
                if (!data.success) return;

                document.querySelectorAll('.card-rating[data-owner]').forEach(el => {
                    const owner = el.dataset.owner;
                    const info = data.ratings[owner];
                    if (info && info.review_count > 0) {
                        const rounded = Math.round(Number(info.avg_rating));
                        const stars = '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
                        el.innerHTML = `<span class="stars">${stars}</span><span class="count">${info.avg_rating} (${info.review_count})</span>`;
                        el.style.display = 'flex';
                    }
                });
            } catch (err) {
                console.error('loadCardRatings failed:', err);
            }
        }

        function buildCard(item) {
            const card   = document.createElement('div');
            const isBooked = !!Number(item.is_booked);
            card.className = 'item-card' + (isBooked ? ' unavailable' : '');

            const images = Array.isArray(item.image_paths) ? item.image_paths : [];
            const imgHTML = images.length
                ? `<img src="${BASE}/${images[0]}" alt="${esc(item.title)}" loading="lazy"
                        onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>No Image</div>'">`
                : `<div class="no-image"><i class="fa-solid fa-image"></i></div>`;

            const location = item.item_location || item.location || item.city || '';
            const ownerEmail = item.owner_email || item.lender_email || item.owner || item.email || '';

            card.innerHTML = `
                <div class="card-image">${imgHTML}</div>
                <div class="card-body">
                    <div class="card-title">${esc(item.title)}</div>
                    <div class="card-rating" data-owner="${esc(ownerEmail)}"></div>
                    ${location ? `<div class="card-location"><i class="fa-solid fa-location-dot"></i>${esc(location)}</div>` : ''}
                    <div class="card-bottom">
                        <div class="card-price">
                            ₹${Number(item.price_per_month ?? item.price_per_day ?? 0).toLocaleString('en-IN')}
                            <span>/ month</span>
                        </div>
                        <span class="card-badge">${isBooked ? 'Currently Rented' : esc(item.condition || '')}</span>
                    </div>
                </div>`;

            card.addEventListener('click', () => {
                window.location.href = `item-details.html?id=${item.id}`;
            });

            return card;
        }

        /* ════════════════════════════════════════════════════════════════
           SORT BUTTONS
        ════════════════════════════════════════════════════════════════ */
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sortMode = btn.dataset.sort;
                applyFilters();
            });
        });

        /* ════════════════════════════════════════════════════════════════
           MOBILE SIDEBAR OPEN / CLOSE
        ════════════════════════════════════════════════════════════════ */
        function openSidebar() {
            document.getElementById('filterSidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeSidebar() {
            document.getElementById('filterSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        /* ════════════════════════════════════════════════════════════════
           UTIL
        ════════════════════════════════════════════════════════════════ */
        function esc(s) {
            return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        /* ── Init ── */
        loadItems();
    </script>
