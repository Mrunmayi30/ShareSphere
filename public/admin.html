<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel - ShareSphere</title>
<link rel="icon" href="css/assets/logo1.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<h2>Admin Panel - ShareSphere</h2>

<table id="requestsTable" border="1" cellpadding="10">
  <thead>
    <tr>
      <th>Email</th><th>Full Name</th><th>DOB</th><th>Phone</th>
      <th>Address</th><th>State</th><th>District</th><th>Pincode</th>
      <th>ID Type</th><th>ID Document</th><th>Self Photo</th>
      <th>Status</th><th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function loadRequests() {
  const res = await fetch("/api/lenders/requests");
  const data = await res.json();
  const tbody = document.querySelector("#requestsTable tbody");
  tbody.innerHTML = "";
  data.forEach(req => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${req.email}</td>
      <td>${req.first_name} ${req.last_name}</td>
      <td>${req.dob ? req.dob.split('T')[0] : ''}</td>
      <td>${req.phone}</td>
      <td>${req.address}</td>
      <td>${req.state}</td>
      <td>${req.district}</td>
      <td>${req.pincode}</td>
      <td>${req.id_type}</td>
      <td>${req.id_document ? `<a href="/${req.id_document}" target="_blank">View</a>` : ''}</td>
      <td>${req.self_photo ? `<a href="/${req.self_photo}" target="_blank">View</a>` : ''}</td>
      <td>${req.status}</td>
      <td>
        ${req.status === "Pending" ? `
          <button class="verify" onclick="updateLenderStatus(${req.id}, 'Verified', '${req.email}')">Verify</button>
          <button class="reject" onclick="updateLenderStatus(${req.id}, 'Rejected', '${req.email}')">Reject</button>
        ` : ""}
      </td>`;
    tbody.appendChild(row);
  });
}

async function updateLenderStatus(id, status, email) {
  try {
    const res = await fetch(`/api/lenders/requests/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status })
    });
    const data = await res.json();
    if (data.success) { alert(`Lender ${email} has been ${status}`); loadRequests(); }
    else { alert("Failed to update status"); }
  } catch (err) { console.error(err); alert("Error updating status"); }
}

loadRequests();
</script>
</body>
</html>
